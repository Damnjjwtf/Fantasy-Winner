[project]
name = "fantasy-winner"
version = "0.1.0"
description = "Pre-computed VBD board + offline draft-night tier tracker"
requires-python = ">=3.11"
dependencies = [
    "nflreadpy>=0.1.0",
    "polars>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
fw-board = "fw.board:main"
fw-track = "fw.track:main"
fw-sheet = "fw.sheet:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fw"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
